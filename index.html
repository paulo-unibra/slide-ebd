<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memórias — apresentação de fotos</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101411;color:#f4f3e9;--accent:#c8df9c}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button,select{background:#252c26;color:inherit;border:1px solid #52604f;border-radius:8px;padding:10px 14px;cursor:pointer}button:hover{background:#394634}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.35;cursor:default}header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;gap:12px}h1{font-size:20px;margin:0;font-weight:550}header span{color:#b9c5b2;font-size:14px}main{height:calc(100dvh - 166px);min-height:240px;position:relative;overflow:hidden;background:#080b09}#stage{position:absolute;inset:0}.slide{position:absolute;width:100%;height:100%;object-fit:contain;will-change:transform,opacity}.counter{position:absolute;bottom:20px;left:24px;padding:8px 12px;background:#101411d9;border-radius:6px;font-variant-numeric:tabular-nums;pointer-events:none}.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 24px}#play{background:var(--accent);color:#182011;border-color:var(--accent);min-width:112px}.controls label{display:flex;align-items:center;gap:7px;font-size:14px}input[type=number]{width:62px;background:#252c26;border:1px solid #52604f;color:inherit;padding:9px;border-radius:6px}input[type=checkbox]{accent-color:var(--accent)}dialog{background:#161d18;color:inherit;border:1px solid #52604f;border-radius:12px;width:min(650px,94vw);max-height:85dvh;padding:24px}dialog::backdrop{background:#000a}dialog h2{margin-top:0;font-size:22px}#list{padding:0;list-style:none}#list li{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #344032}#list img{height:50px;width:70px;object-fit:cover;border-radius:4px}#list span{flex:1}#list button{padding:6px 10px}.dialog-actions{display:flex;gap:10px;justify-content:flex-end}#notice{position:absolute;top:20px;left:20px;right:20px;text-align:center;background:#342c17;padding:12px;border-radius:8px}#notice:empty{display:none}body.fullscreen header,body.fullscreen .controls{display:none}body.fullscreen main{height:100dvh}body.fullscreen main:hover .exit{opacity:1}.exit{position:absolute;right:20px;top:20px;display:none}body.fullscreen .exit{display:block;opacity:.3}::selection{background:var(--accent);color:#101411}@media(max-width:700px){header{padding:14px 16px}header span{display:none}main{height:calc(100dvh - 235px)}.controls{padding:12px;gap:8px}.controls button{padding:9px 12px}.controls label{font-size:13px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

body{min-height:100dvh;display:flex;flex-direction:column}main{flex:1;min-height:240px;height:auto}.music{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px 24px 20px}.music label{display:flex;align-items:center;gap:8px;font-size:14px}.music input[type=range]{width:100px;accent-color:var(--accent)}#track{max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#b9c5b2;font-size:14px}#music-status{width:100%;text-align:center;font-size:13px;color:#c8df9c}#music-status:empty{display:none}body.fullscreen .music{display:none}body.fullscreen main{flex:none}@media(max-width:700px){main{height:auto;min-height:42dvh}.music{padding:8px 12px 16px;gap:10px}#track{max-width:160px}}
</style>
<header><h1>Memórias</h1><span>8 fotografias · uma história de cada vez</span><button id="organize">Organizar fotos</button></header>
<main aria-label="Apresentação de fotografias"><div id="stage"></div><div class="counter" id="counter" aria-live="polite"></div><div id="notice" role="status"></div><button class="exit" id="exit">Sair da tela cheia</button></main>
<div class="controls" aria-label="Controles da apresentação"><button id="prev" aria-label="Foto anterior">Anterior</button><button id="play">Pausar</button><button id="next" aria-label="Próxima foto">Próxima</button><label>Tempo <input id="duration" type="number" min="1" max="120" value="5" aria-label="Segundos por foto"> s</label><label><input id="loop" type="checkbox" checked>Loop</label><label>Efeito <select id="effect"><option value="random">Aleatório</option><option value="fade">Dissolver</option><option value="slide">Deslizar</option><option value="zoom">Aproximar</option><option value="reveal">Revelar</option></select></label><button id="full">Tela cheia</button></div>
<section class="music" aria-label="Música de fundo"><input type="file" id="music-file" accept=".mp3,audio/mpeg" hidden><button id="choose-music">Escolher / trocar MP3</button><span id="track">Nenhuma música selecionada</span><button id="music-play" disabled>Reproduzir música</button><label>Volume <input id="volume" type="range" min="0" max="100" value="50"></label><label><input id="music-loop" type="checkbox" checked>Repetir música</label><button id="music-remove" disabled>Remover música</button><span id="music-status" role="status" aria-live="polite"></span><audio id="music" loop preload="metadata"></audio></section>
<dialog id="editor"><h2>Ordem das fotos</h2><p>Use os botões para montar a sequência. A ordem é salva neste navegador.</p><ol id="list"></ol><div class="dialog-actions"><button id="shuffle">Embaralhar</button><button id="reset">Restaurar</button><button id="close">Concluir</button></div></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), original=Array.from({length:8},(_,i)=>`images/foto-${String(i+1).padStart(2,'0')}.jpg`);
let order=[...original],index=0,playing=true,timer=null,active=null,busy=false,lastEffect='';
try{const saved=JSON.parse(localStorage.getItem('memorias-order'));if(Array.isArray(saved)&&saved.length===original.length&&new Set(saved).size===original.length&&saved.every(x=>original.includes(x)))order=saved;}catch{}
function save(){try{localStorage.setItem('memorias-order',JSON.stringify(order));}catch{}}
function schedule(){clearTimeout(timer);if(playing&&!$('#editor').open&&!document.hidden)timer=setTimeout(()=>step(1),Math.max(1,Math.min(120,Number($('#duration').value)||5))*1000);}
function toggle(value=!playing){playing=value;$('#play').textContent=playing?'Pausar':'Reproduzir';schedule();}
async function show(i,animate=true){if(busy)return;busy=true;clearTimeout(timer);index=i;const img=new Image();img.className='slide';img.alt=`Fotografia ${original.indexOf(order[i])+1} da apresentação`;img.src=order[i];$('#notice').textContent='';try{await img.decode();}catch{$('#notice').textContent='Não foi possível carregar esta foto. Confira a pasta images.';busy=false;schedule();return;}
const old=active;$('#stage').append(img);active=img;$('#counter').textContent=`${i+1} / ${order.length}`;
let effect=$('#effect').value;if(effect==='random'){const choices=['fade','slide','zoom','reveal'].filter(x=>x!==lastEffect);effect=choices[Math.floor(Math.random()*choices.length)];}lastEffect=effect;
const frames={fade:[{opacity:0},{opacity:1}],slide:[{transform:`translateX(${Math.random()<.5?'-':''}100%)`,opacity:.3},{transform:'translateX(0)',opacity:1}],zoom:[{transform:'scale(1.14)',opacity:0},{transform:'scale(1)',opacity:1}],reveal:[{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}]};
if(animate&&old&&!matchMedia('(prefers-reduced-motion: reduce)').matches){await img.animate(frames[effect],{duration:950,easing:'cubic-bezier(.16,1,.3,1)'}).finished.catch(()=>{});}if(old)old.remove();busy=false;schedule();}
function step(d){if(busy)return;let target=index+d;if(target>=order.length){if(!$('#loop').checked){toggle(false);return;}target=0;}if(target<0)target=order.length-1;show(target);}
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);$('#play').onclick=()=>toggle();$('#duration').onchange=()=>{let n=Number($('#duration').value);$('#duration').value=Math.max(1,Math.min(120,n||5));schedule();};$('#loop').onchange=schedule;
function renderList(){const list=$('#list');list.replaceChildren();order.forEach((src,i)=>{const li=document.createElement('li'),im=new Image(),text=document.createElement('span');im.src=src;im.alt='';text.textContent=`${i+1}. Foto ${original.indexOf(src)+1}`;li.append(im,text);[-1,1].forEach(d=>{const b=document.createElement('button');b.textContent=d<0?'Subir':'Descer';b.setAttribute('aria-label',`${b.textContent} foto ${original.indexOf(src)+1}`);b.disabled=i+d<0||i+d>=order.length;b.onclick=()=>{[order[i],order[i+d]]=[order[i+d],order[i]];save();renderList();};li.append(b);});list.append(li);});}
$('#organize').onclick=()=>{if(busy)return;clearTimeout(timer);renderList();$('#editor').showModal();};$('#shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}save();renderList();};$('#reset').onclick=()=>{order=[...original];save();renderList();};$('#close').onclick=()=>$('#editor').close();$('#editor').onclose=()=>show(0,false);
$('#full').onclick=async()=>{try{await document.documentElement.requestFullscreen();}catch{$('#notice').textContent='Tela cheia indisponível neste navegador. Tente abrir o HTML diretamente.';}};$('#exit').onclick=()=>document.exitFullscreen();document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fullscreen',!!document.fullscreenElement));
document.addEventListener('keydown',e=>{if($('#editor').open||/INPUT|SELECT|BUTTON/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();toggle();}if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);if(e.key.toLowerCase()==='f')$('#full').click();});document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(timer);else schedule();});original.forEach(src=>{const im=new Image();im.src=src;});show(0,false);

const music=$('#music');let musicURL=null;music.volume=.5;
function musicMessage(text){$('#music-status').textContent=text;}
function updateMusic(){ $('#music-play').textContent=music.paused?'Reproduzir música':'Pausar música'; }
async function playMusic(){try{await music.play();musicMessage('');}catch{musicMessage('Não foi possível reproduzir. Tente novamente ou escolha outro MP3.');}updateMusic();}
$('#choose-music').onclick=()=>$('#music-file').click();
$('#music-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!/\.mp3$/i.test(file.name)&&file.type!=='audio/mpeg'){musicMessage('Escolha um arquivo de áudio MP3.');e.target.value='';return;}music.pause();music.removeAttribute('src');music.load();if(musicURL)URL.revokeObjectURL(musicURL);musicURL=URL.createObjectURL(file);music.src=musicURL;$('#track').textContent=file.name;$('#track').title=file.name;$('#music-play').disabled=false;$('#music-remove').disabled=false;musicMessage('Carregando música…');await playMusic();e.target.value='';};
$('#music-play').onclick=()=>{if(music.paused)playMusic();else music.pause();};
$('#volume').oninput=e=>{music.volume=Number(e.target.value)/100;};
$('#music-loop').onchange=e=>{music.loop=e.target.checked;};
$('#music-remove').onclick=()=>{music.pause();music.removeAttribute('src');music.load();if(musicURL)URL.revokeObjectURL(musicURL);musicURL=null;$('#track').textContent='Nenhuma música selecionada';$('#track').title='';$('#music-play').disabled=true;$('#music-remove').disabled=true;musicMessage('');updateMusic();};
['play','pause','ended'].forEach(event=>music.addEventListener(event,updateMusic));
music.addEventListener('error',()=>{if(musicURL)musicMessage('Este MP3 não pôde ser lido. Escolha outro arquivo.');});
window.addEventListener('pagehide',()=>{if(musicURL)URL.revokeObjectURL(musicURL);});
</script></html>
